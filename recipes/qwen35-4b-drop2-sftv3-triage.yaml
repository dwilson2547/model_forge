# Full-lifecycle recipe (v2 format) — the first model whose whole chain is recorded.
#
# v1 recipes covered surgery + quant (the `ops:` block). This format extends to the
# whole lineage: surgery -> mtp graft -> recovery (with dataset provenance) ->
# convert/quant -> evaluation. Stages beyond `ops:` are exact reproducer commands
# rather than interpreter inputs today; the build stage consumes `ops:`.
#
# PROVENANCE/PRIVACY: the recovery dataset is extracted from the private
# incident-operator Postgres history. The .jsonl artifacts are neither committed
# nor published; `dataset:` regenerates them from the live DB.
name: qwen35-4b-drop2-sftv3-triage
base:
  model: Qwen/Qwen3.5-4B
  hf_dir: ${FORGE_ROOT}/base/Qwen/Qwen3.5-4B          # pristine source (graft donor)
calib_file: ${FORGE_ROOT}/data/wiki.test.txt

surgery:                                              # -> hf-edited (34 layers, 3.76B)
  base_dir: ${FORGE_ROOT}/base/Qwen/Qwen3.5-4B
  out_dir: ${FORGE_ROOT}/runs/qwen35-4b/slice/drop2-ranked
  llamacpp_dir: /home/daniel/llama.cpp
  ops:
    - op: drop_layers
      count: 2
      strategy: ranked                               # neighbor-cosine; full-attn protected
      min_gap: 2
      # measured outcome: dropped layers 24 and 28 (2026-11-08 gradient board)

mtp_graft:                                           # LM Studio asserts nextn.*; pipeline drops them
  donor: ${FORGE_ROOT}/base/Qwen/Qwen3.5-4B         # 15 pristine mtp.* tensors
  script: scripts/legacy/ampere/graft_sft3.py                         # per-candidate sed of graft_mtp.py

dataset:                                             # homelab-private; regenerate, never commit
  extractor: surgery/corpus_triage.py
  command: >
    PGPASSWORD=... python surgery/corpus_triage.py
      --out ${FORGE_ROOT}/data/
      --mixed ${FORGE_ROOT}/data/mixed.train.txt
      --mixed-chars 6000000 --holdout 10,28,46
  composition:                                       # 3448 records (+32 dropped >ctx-24 tokens)
    operator_turns_x4: 62              # 3 session protocols from the incident history
    knowledge_pairs_x3: 67             # 13 runbooks + 17*ops + primer
    continuation_pairs: 2999           # the mixed repair diet, v2-style formats
  holdouts: [10, 28, 46]                # incident ids never trained on (46 = the demo case)
  notes: ~30 incidents total; sqlite-free postgres pull via kubectl port-forward

recovery:                                            # QLoRA on the 5080; 20 min, 3.2 GiB VRAM
  trainer: surgery/recover_gpu.py
  hf_dir: ${FORGE_ROOT}/runs/qwen35-4b/slice/drop2-ranked/hf-edited           # sliced checkpoint
  command: >
    python surgery/recover_gpu.py ${FORGE_ROOT}/runs/qwen35-4b/slice/drop2-ranked/hf-edited
      --sft-dataset ${FORGE_ROOT}/data/sft-v3-dataset.jsonl
      --ctx 6144 --batch 1 --accum 4 --epochs 2
      --lora-r 16 --lr 1e-4 --save-every 200
      --out ${FORGE_ROOT}/runs/qwen35-4b/drop2-repair/sft3
  lora_r: 16
  lr: 1e-4
  format: sft-chat-v3                   # native think-open/reason/closed/answer targets
  measured: {loss_first: 1.55, loss_last20_avg: 1.13, wall_minutes: 20}
  merge: bf16 CPU exact merge (recover_gpu --merge path)

conversion:                                          # on the Altra
  convert: convert_hf_to_gguf.py --outtype f16
  quants: [Q4_K_M]                     # --allow-requantize --leave-output-tensor
  out_dir: ${FORGE_ROOT}/runs/qwen35-4b/drop2-repair/sft3/gguf

evaluation:
  bench: bench.runner --chat           # coding docker-graded, instruct, needle@7.5k, loop-thresh
  board_row: {coding: 1.0, instruct: 0.2, needle: 1.0, composite: 0.733, loop_threshold: 0.7}
  heldout_triage: [10, 28, 46]          # incident 46: causally correct OOMKilled diagnosis, eos@635
  references: docs/design.md §0h–§0i
